{{ define "main" }}
<main class="page-main pa4" role="main">
  <section class="page-content mw8 center">

    <h1 class="f2 f1-m f1-l fw5-ns mv4 lh-solid tracked-tight-ns">{{ .Title }}</h1>

    {{ with .Content }}
      <div class="research-intro f4 lh-copy">{{ . }}</div>
    {{ end }}

    <div class="project-list">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "project-card.html" . }}
      {{ end }}
    </div>

  </section>
</main>
{{ end }}
